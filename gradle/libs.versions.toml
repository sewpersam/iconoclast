# Versions looked up on 2026-10-10. Sources in docs/verification/m0.md.
[versions]
agp = "9.3.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
apksig = "9.4.1"
buildTools = "36.0.0"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
coroutines = "1.11.0"
# Looked up 2026-10-10: Maven Central maven-metadata.xml and the kotlinx.serialization CHANGELOG
# (1.11.0 stable, 2026-04-10; 1.12.0-RC is a release candidate). Google Maven for navigation.
kotlinxSerialization = "1.11.0"
navigation = "2.10.2"
# The version navigation-compose and activity-compose already resolve, read from
# ./gradlew :app:dependencies on 2026-10-10; declared because the app imports both.
lifecycle = "2.11.0"
compileSdk = "37"
targetSdk = "37"
minSdk = "33"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
